version: '3.8'

services:
  # --- Frontend: React compilado y servido con nginx ---
  # Para desarrollo con Vite: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # --- Backend: Node.js/Express ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env          # Lee TODAS las variables desde el archivo .env del backend
    environment:
      - DATABASE_URL=postgresql://fogon_user:fogon_password@db:5432/fogon_dorado
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Base de Datos: PostgreSQL ---
  db:
    image: postgres:16-alpine
    ports:
      # Solo accesible desde el mismo servidor (no expuesta a la red)
      - "127.0.0.1:5435:5432"

    environment:
      - POSTGRES_USER=fogon_user
      - POSTGRES_PASSWORD=fogon_password
      - POSTGRES_DB=fogon_dorado
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fogon_user -d fogon_dorado"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
