<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHICKEN ERP - MONITOR DE COCINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        :root { --brand-primary: #f59e0b; --brand-dark: #111827; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .sidebar-item { transition: all 0.2s; border-radius: 12px; margin: 4px 12px; }
        .sidebar-item:hover { background-color: rgba(255, 255, 255, 0.1); color: white; }
        .sidebar-active { background-color: var(--brand-primary); color: var(--brand-dark) !important; font-weight: 700; }
        
        .ticket-cocina { background: #ffffff; position: relative; }
        .ticket-cocina::after {
            content: ""; position: absolute; bottom: -5px; left: 0; right: 0; height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px 10px, transparent 12px, #ffffff 13px);
            background-position: 0 -10px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">

    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden md:hidden"></div>

    <aside id="sidebar-menu" class="fixed md:relative inset-y-0 left-0 w-64 bg-slate-900 text-slate-400 flex flex-col shadow-2xl z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="p-6 flex items-center justify-between md:justify-start gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-slate-900 shadow-lg shadow-amber-500/20">
                    <i data-lucide="utensils-crossed"></i>
                </div>
                <span class="text-white font-black text-xl tracking-tighter">CHICKEN<span class="text-amber-500">ERP</span></span>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white md:hidden p-2">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <nav class="flex-1 mt-4 space-y-1 overflow-y-auto custom-scrollbar">
            <a href="index.html" class="sidebar-item flex items-center gap-3 p-3 text-sm">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="salon.html" class="sidebar-item flex items-center gap-3 p-3 text-sm">
                <i data-lucide="layout-grid" class="w-5 h-5"></i> Salón / Mesas
            </a>
            <a href="cocina.html" class="sidebar-item sidebar-active flex items-center gap-3 p-3 text-sm">
                <i data-lucide="chef-hat" class="w-5 h-5"></i> Cocina / Pedidos
            </a>
            <a href="caja.html" class="sidebar-item flex items-center gap-3 p-3 text-sm">
                <i data-lucide="calculator" class="w-5 h-5"></i> Caja / Cobros
            </a>
			<a href="reportes.html" class="sidebar-item flex items-center gap-3 p-3 text-sm">
                <i data-lucide="pie-chart" class="w-5 h-5"></i> Reportes
            </a>
			<div class="my-4 border-t border-slate-800 mx-4"></div>
            <a href="carta.html" class="sidebar-item flex items-center gap-3 p-3 text-sm">
                <i data-lucide="book-open" class="w-5 h-5"></i> Carta e Inventario
            </a>
            <a href="usuarios.html" class="sidebar-item flex items-center gap-3 p-3 text-sm">
                <i data-lucide="users-round" class="w-5 h-5"></i> Personal y Accesos
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 shrink-0">
            <div class="flex items-center gap-3 p-2 bg-slate-800/50 rounded-xl">
                <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-xs font-bold text-white">AD</div>
                <div class="text-xs">
                    <p class="text-white font-bold">Administrador</p>
                    <p class="text-slate-500 truncate w-32">Local Principal</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden w-full bg-slate-900">
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 md:px-8 z-10 shrink-0 text-white">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="p-2 text-slate-400 hover:bg-slate-700 rounded-xl md:hidden">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="hidden sm:flex items-center gap-2 text-slate-400 text-sm font-medium">
                    <span>Operaciones</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    <span class="text-white font-bold">Monitor de Preparación</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-xs font-bold text-amber-400 bg-amber-500/10 px-3 py-1.5 rounded-lg border border-amber-500/20">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                    </span>
                    Sincronización en Vivo
                </div>
            </div>
        </header>

        <section class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
            <div class="mb-6 md:mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-white uppercase tracking-tight">Pedidos en Cola</h1>
                    <p class="text-xs md:text-sm text-slate-400">Tickets sincronizados directamente desde el Salón.</p>
                </div>
                <div class="text-white flex items-center gap-2 font-bold text-sm bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 shadow-md">
                    <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
                    <span id="reloj-cocina">00:00</span>
                </div>
            </div>

            <div id="grid-cocina" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 items-start pb-10">
                </div>
        </section>
    </main>

    <script>
        let mesasDB = JSON.parse(localStorage.getItem('polleria_mesas')) || [];

        function guardarBD() {
            localStorage.setItem('polleria_mesas', JSON.stringify(mesasDB));
        }

        setInterval(() => {
            let datosGuardados = localStorage.getItem('polleria_mesas');
            if (datosGuardados) {
                mesasDB = JSON.parse(datosGuardados);
                renderizarCocina();
            }
            document.getElementById('reloj-cocina').innerText = new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        }, 2000);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function renderizarCocina() {
            const grid = document.getElementById('grid-cocina');
            let html = '';

            const mesasCocina = mesasDB.filter(m => m.estado === 'Cocina' && m.pedidoData);

            mesasCocina.forEach((m) => {
                
                // CRUCIAL: Filtrar para que la cocina solo vea lo que NO está en el historial (nuevos)
                const itemsParaCocina = m.pedidoData.items.filter(item => !item.historial);

                // Si no hay items nuevos (raro pero por si acaso), no dibuja el ticket
                if(itemsParaCocina.length === 0) return;

                const listaItems = itemsParaCocina.map(item => `
                    <div class="flex items-start py-2 border-b border-dashed border-slate-300 last:border-0">
                        <span class="font-black text-lg mr-3 text-slate-900 w-6 text-center shrink-0">${item.cant}</span>
                        <span class="flex-1 text-slate-800 font-bold text-sm leading-snug pt-0.5 uppercase">${item.nombre}</span>
                    </div>
                `).join('');

                const badgeAdicional = m.pedidoData.adicional 
                    ? `<div class="absolute -top-3 -right-3 bg-red-600 text-white text-[11px] font-black px-3 py-1 rounded-lg shadow-lg rotate-12 animate-pulse border-2 border-white tracking-widest z-10">¡ADICIONAL!</div>` 
                    : ``;

                html += `
                    <div class="ticket-cocina rounded-t-xl rounded-b shadow-2xl flex flex-col overflow-hidden transform transition-all hover:-translate-y-1">
                        
                        <div class="bg-amber-400 p-3 text-center text-slate-900 shrink-0 border-b-4 border-amber-500 relative">
                            ${badgeAdicional}
                            <h2 class="font-black text-3xl uppercase tracking-tighter leading-none">Mesa ${m.num}</h2>
                        </div>
                        
                        <div class="p-3 flex justify-between items-center text-xs font-black text-slate-500 border-b-2 border-slate-900 shrink-0 bg-slate-50">
                            <span class="flex items-center gap-1.5"><i data-lucide="user" class="w-4 h-4 text-slate-400"></i> ${m.pedidoData.mesero}</span>
                            <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4 text-slate-400"></i> ${m.pedidoData.hora}</span>
                        </div>
                        
                        <div class="p-4 flex-1 bg-white min-h-[150px]">
                            ${listaItems}
                        </div>
                        
                        <div class="p-4 bg-slate-50 mt-2 shrink-0 pb-6">
                            <button onclick="despacharPedido(${m.num - 1})" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-black uppercase tracking-widest rounded-xl transition-all shadow-[0_4px_0_0_#059669] hover:shadow-[0_2px_0_0_#059669] hover:translate-y-0.5 flex items-center justify-center gap-2 text-sm">
                                <i data-lucide="check-check" class="w-5 h-5"></i> Listo
                            </button>
                        </div>
                    </div>
                `;
            });

            if (html === '') {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 opacity-50">
                        <i data-lucide="check-circle-2" class="w-16 h-16 text-emerald-500 mb-4"></i>
                        <p class="text-white text-xl font-bold uppercase tracking-widest">Sin pedidos pendientes</p>
                        <p class="text-slate-400 mt-2">La cocina está al día.</p>
                    </div>
                `;
            } else {
                grid.innerHTML = html;
            }

            lucide.createIcons();
        }

        function despacharPedido(indexMesa) {
            if(mesasDB[indexMesa]) {
                mesasDB[indexMesa].estado = 'Servido';
                
                // CRUCIAL: Al servir la mesa, TODOS sus items actuales pasan al historial
                // para que en el próximo posible adicional, estén bloqueados.
                if(mesasDB[indexMesa].pedidoData && mesasDB[indexMesa].pedidoData.items) {
                    mesasDB[indexMesa].pedidoData.adicional = false;
                    mesasDB[indexMesa].pedidoData.items.forEach(i => i.historial = true);
                }

                guardarBD();
                renderizarCocina();
            }
        }

        renderizarCocina();
        lucide.createIcons();
    </script>
</body>
</html>
