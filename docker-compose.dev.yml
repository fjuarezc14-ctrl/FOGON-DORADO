# Desarrollo local con Vite (recarga en caliente):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Vite escucha en el 5173 dentro del contenedor (en producción nginx usa el 80)
    ports: !override
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
